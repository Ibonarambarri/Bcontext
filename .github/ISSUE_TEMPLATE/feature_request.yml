name: Feature request
description: Propose a change or an addition
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Bcontext is maintained by one person, so the problem matters more than the solution: describe what you are trying to do.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you or your agents are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to open a pull request for this (after we agree on the shape)
